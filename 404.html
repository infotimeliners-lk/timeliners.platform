<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · TimeLiners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#FE730A;
  --bg:#0A0A0A;
  --t1:#EDEBE6;--t2:#9C9891;--t3:#615D57;
  --fm:'Poppins',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fm);background:var(--bg);color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
a{text-decoration:none;cursor:pointer}
.wrap{max-width:420px;width:100%;text-align:center;padding-top:1.6rem}
.num-row{display:flex;align-items:center;justify-content:center;line-height:1;margin-bottom:.8rem}
.digit{font-size:6.5rem;font-weight:800;color:var(--ac);letter-spacing:4px}
.zero-wrap{position:relative;display:inline-block}
.timmy-peek{position:absolute;left:50%;top:-2.3rem;transform:translateX(-50%);width:3.6rem;height:auto;z-index:2;clip-path:inset(0 0 8% 0)}
h1{font-size:clamp(1.1rem,3.4vw,1.3rem);font-weight:700;color:var(--t1);margin:.6rem 0 .6rem;line-height:1.3}
p{color:var(--t2);font-size:.85rem;line-height:1.6}
p a{color:var(--ac);font-weight:600;text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="num-row">
    <span class="digit">4</span>
    <span class="zero-wrap">
      <span class="digit">0</span>
      <svg class="timmy-peek" viewBox="0 0 580 725" xmlns="http://www.w3.org/2000/svg">
        <!-- Timmy, head tilted, one eye squinted — puzzled, peeking over the zero -->
        <g transform="rotate(-10 290 360)">
          <path d="M453 682 L498 681 L573 603 L572 502 L502 500 L496 547 L454 547 L451 460 Z" fill="#fe730a"/>
          <path d="M64 6 L6 189 L183 110 Z" fill="#fe730a"/>
          <path d="M91 78 L87 129 L138 129 Z" fill="#181818"/>
          <path d="M458 6 L533 187 L357 110 Z" fill="#fe730a"/>
          <path d="M448 79 L401 129 L452 129 Z" fill="#181818"/>
          <path d="M6 187 L6 384 L133 388 L86 462 L87 710 L160 710 L165 611 L229 614 L232 712 L308 710 L311 612 L377 614 L380 712 L450 711 L453 682 L451 460 L405 391 L533 385 L533 187 L357 110 L183 110 Z" fill="#fe730a"/>
          <!-- left eye: squinted, skeptical -->
          <rect x="128" y="254" width="46" height="15" rx="6" fill="#181818" transform="rotate(-11 151 261)"/>
          <!-- right eye: wide, surprised -->
          <rect x="366" y="230" width="44" height="46" rx="3" fill="#181818"/>
        </g>
        <!-- floating question mark -->
        <g>
          <circle cx="418" cy="66" r="34" fill="#fe730a"/>
          <text x="418" y="80" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle">?</text>
        </g>
      </svg>
    </span>
    <span class="digit">4</span>
  </div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or another error occurred. Go back, or head over to <a href="/">Home</a>.</p>
</div>
</body>
</html>
