name: Weekly Database Backup

on:
  schedule:
    - cron: '0 0 * * 0'   # every Sunday at 00:00 UTC
  workflow_dispatch: {}    # adds a manual "Run workflow" button, for testing

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d')
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F p | gzip > "timeliners-backup-$TIMESTAMP.sql.gz"
          echo "BACKUP_FILE=timeliners-backup-$TIMESTAMP.sql.gz" >> $GITHUB_ENV

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload backup to R2
        run: |
          rclone copy "$BACKUP_FILE" "r2:timeliners-backups/"

      - name: Remove backups older than 60 days
        run: |
          rclone delete "r2:timeliners-backups/" --min-age 60d

      - name: Clean up local file
        run: rm -f "$BACKUP_FILE"
